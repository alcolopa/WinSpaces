name: Release installer

# Builds Windows Spaces as a self-contained win-x64 app and packages it into a
# single WindowsSpacesSetup-<version>.exe installer (Inno Setup), then attaches
# it to a GitHub Release. Triggered by pushing a version tag, e.g.:
#   git tag v1.2.0 && git push origin v1.2.0

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on a manual build (e.g. 0.0.0-test)"
        required: false
        default: "0.0.0-manual"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $version = "${{ github.event.inputs.version }}"
            if ([string]::IsNullOrWhiteSpace($version)) { $version = "0.0.0-manual" }
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore WindowsSpaces.sln

      - name: Run tests
        run: dotnet test src/WindowsSpaces.Tests/WindowsSpaces.Tests.csproj -c Release --no-restore

      - name: Publish app (self-contained win-x64)
        run: >
          dotnet publish src/WindowsSpaces.App/WindowsSpaces.App.csproj
          -c Release -r win-x64 -p:Platform=x64
          --self-contained true
          -p:PublishReadyToRun=false
          -p:WindowsAppSDKSelfContained=true
          -o publish/App

      - name: Publish CLI (self-contained win-x64)
        run: >
          dotnet publish src/WindowsSpaces.Cli/WindowsSpaces.Cli.csproj
          -c Release -r win-x64
          --self-contained true
          -p:PublishReadyToRun=false
          -o publish/App

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: cmd
        run: >
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DAppVersion=${{ steps.version.outputs.version }}
          /DPublishDir=..\publish\App
          installer\WindowsSpaces.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsSpacesSetup-${{ steps.version.outputs.version }}
          path: dist/WindowsSpacesSetup-*.exe

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WindowsSpacesSetup-*.exe
          generate_release_notes: true
